[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "cnn: tests that require PyTorch",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.black]
line-length = 88
target-version = ["py311"]
